name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA, not a version tag: a tag can be
      # moved by the action's maintainer (or an attacker who compromises
      # their account), and this job holds id-token: write.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; the runner's bundled
      # npm may be older, so pin an up-to-date one explicitly.
      - run: npm install -g npm@^11

      - run: npm ci
      - run: npm run build
      - run: npm test

      - run: npm publish --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true

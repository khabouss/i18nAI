name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.x, 24.x]
    steps:
      # Actions are pinned to a commit SHA, not a version tag: a tag can be moved
      # by the action's maintainer (or an attacker who compromises their account).
      # Same SHAs as release.yml, which already pins for the same reason.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # locale-ai always runs onnxruntime-node with executionProviders: ["cpu"] (see
      # src/marian.ts), so skip its postinstall download of the ~260 MB CUDA provider.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npm run build
      - run: npm test
